services:
  - type: web
    name: scholarpress
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scholarpress-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: personal.shubham1872@gmail.com

databases:
  - name: scholarpress-db
    plan: free
    databaseName: scholarpress
    user: scholarpress_user
